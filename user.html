<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Registration Form</title>
<style>
body{font-family:Arial,sans-serif;background-color:#f2f2f2}
.container{width:400px;margin:50px auto;background:white;padding:20px;border-radius:8px;box-shadow:0 0 10px rgba(0,0,0,0.2)}
h2{text-align:center}
label{font-weight:bold}
input,select{width:100%;padding:8px;margin:8px 0 15px;border:1px solid #ccc;border-radius:4px}
input[type="radio"]{width:auto}
.gender{margin-bottom:15px}
button{width:100%;padding:10px;background-color:#28a745;color:white;border:none;border-radius:4px;font-size:16px;cursor:pointer}
button:hover{background-color:#218838}
</style>
</head>
<body>
<div class="container">
<h2>User Registration Form</h2>
<form action="#" method="post">
<label for="fullname">Full Name</label>
<input type="text" id="fullname" name="fullname" required>
<label for="email">Email</label>
<input type="email" id="email" name="email" required>
<label for="phone">Phone Number</label>
<input type="tel" id="phone" name="phone" required>
<label for="username">Username</label>
<input type="text" id="username" name="username" required>
<label for="password">Password</label>
<input type="password" id="password" name="password" required>
<label for="confirmPassword">Confirm Password</label>
<input type="password" id="confirmPassword" name="confirmPassword" required>
<div class="gender">
<label>Gender</label><br>
<input type="radio" name="gender" value="Male"> Male
<input type="radio" name="gender" value="Female"> Female
<input type="radio" name="gender" value="Other"> Other
</div>
<label for="country">Country</label>
<select id="country" name="country">
<option value="">Select Country</option>
<option>India</option>
<option>USA</option>
<option>UK</option>
<option>Canada</option>
<option>Australia</option>
</select>
<button type="submit">Register</button>
</form>
</div>
</body>
</html>
